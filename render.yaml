services:
  - type: web
    name: banana-disease-ripeness
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GRADIO_SSR_MODE
        value: "false"
